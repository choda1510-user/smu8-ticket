services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile.dev
    container_name: database
    ports:
      - "3306:3306"
    networks:
      - smu8-ticket-network
    volumes:
      - mysql_database:/var/lib/mysql
  redis-ticket:
    build:
      context: ./redis-ticket
      dockerfile: Dockerfile.dev
    container_name: redis-ticket
    ports:
      - "6379:6379"
    networks:
      - smu8-ticket-network
  redis-waiting:
    build:
      context: ./redis-waiting
      dockerfile: Dockerfile.dev-waiting
    container_name: redis-waiting
    ports:
      - "6381:6379"
    networks:
      - smu8-ticket-network
volumes:
  mysql_database:
networks:
  smu8-ticket-network:
    driver: bridge