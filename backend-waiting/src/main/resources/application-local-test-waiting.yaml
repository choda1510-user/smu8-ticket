# 로컬 개발환경에서 테스트 할 때 사용하는 프로파일
spring:
  config:
    activate:
      on-profile: local-test-waiting
  data:
    redis-waiting:
      host: redis-waiting
      port: 6379
cors:
  origins:
    - http://localhost:80
    - http://localhost
  headers:
    - Content-Type
    - Authorization
  methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
    - HEAD
  credentials: true
token:
  secret: mWy0rsOo1NgP8KGnEwgOFPZaR7auleEy+BP+1bAOB1M=
  algorithm: HmacSHA256

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
