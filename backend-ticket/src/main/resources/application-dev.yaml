spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://database:3306/smu8ticket
    username: admin
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: redis-ticket
      port: 6379

  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s

logging:
  level:
    org.springframework:
      web: Debug
      security: Debug
    com.smu8.ticket: Trace
server:
  port: 8080