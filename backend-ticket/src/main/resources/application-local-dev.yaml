# 로컬 개발환경에서 개발할 때 사용하는 프로파일
spring:
  config:
    activate:
      on-profile: local-dev

  datasource:
    url: jdbc:mysql://localhost:3306/smu8ticket
    username: admin
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  data:
    redis-ticket:
      host: localhost
      port: 6379
  storage:
    url: http://localhost:8080/api/images

  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
cors:
  origins:
    - http://localhost:5173
  headers:
    - Content-Type
    - Authorization
  methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
    - HEAD
  credentials: true
logging:
  level:
    org.springframework:
      web: Debug
      security: Debug
    com.smu8.ticket: Trace
server:
  port: 8080
token:
  secret: mWy0rsOo1NgP8KGnEwgOFPZaR7auleEy+BP+1bAOB1M=
  algorithm: HmacSHA256
  access-token:
    prefix: "access-token:"
    expire: 3600
  refresh-token:
    prefix: "refresh-token:"
    expire: 7200