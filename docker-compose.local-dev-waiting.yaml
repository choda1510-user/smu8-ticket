services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile.dev
    container_name: database
    ports:
      - "3306:3306"
    networks:
      - smu8-ticket-network
    volumes:
      - mysql_database:/var/lib/mysql
  redis-ticket:
    image: redis:latest
    container_name: redis-ticket
    ports:
      - "6379:6379"
    networks:
      - smu8-ticket-network
  redis-waiting:
    image: redis:latest
    container_name: redis-waiting
    ports:
      - "6381:6379"
    networks:
      - smu8-ticket-network
    volumes:
      - redis_waiting_volume:/data
volumes:
  mysql_database:
  redis_waiting_volume:
networks:
  smu8-ticket-network:
    driver: bridge